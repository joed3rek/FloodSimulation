[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spongepark"
version = "0.1.0"
description = "Sponge park stormwater design and flood simulation engine (EPA SWMM 5 via PySWMM)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Habitat Collective" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "pydantic>=2.5",
    "typer>=0.9",
    "pyswmm>=2.2",          # bundles unmodified EPA SWMM 5.2 via swmm-toolkit
    "swmm-toolkit>=0.17",
    "shapely>=2.0",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "ezdxf>=1.1",           # DXF survey drawings (DWG via ODA File Converter)
    "scipy>=1.10",
    "pyshp>=2.3",           # shapefiles (catchment boundaries)
    "pymoo>=0.6.1",         # NSGA-II optimisation (Phase 5)
    "scikit-learn>=1.3",    # surrogate models (Phase 5)
    "rhino3dm>=8.4",        # .3dm export and round trip (Phase 6)
    "numba>=0.58",          # 2D rain-on-grid model (Phase 6)
    "fastapi>=0.110",       # local engine API (Phase 7)
    "uvicorn>=0.27",
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg for the app's video export
    "pyyaml>=6",            # knowledge/sources.yaml (NbS knowledge base)
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
# NbS knowledge base extraction (docs/KNOWLEDGE_BRIEF.md, A3): text and layout, tables, web pages, spreadsheets
knowledge = ["pymupdf>=1.24", "pdfplumber>=0.11", "beautifulsoup4>=4.12", "openpyxl>=3.1"]

[project.scripts]
spongepark = "spongepark.cli.main:app"

[tool.setuptools.packages.find]
include = ["spongepark*"]

[tool.setuptools.package-data]
"spongepark.engine.rainfall" = ["data/*.csv"]
"spongepark.engine.nbs" = ["data/*.json"]
"spongepark.engine.hydrology" = ["data/*.json"]
"spongepark.engine.io" = ["data/*.json"]
"spongepark.engine.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
