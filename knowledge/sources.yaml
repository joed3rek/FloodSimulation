# NbS knowledge base: source registry (docs/KNOWLEDGE_BRIEF.md, A1).
#
# access:   open           - the owner publishes it openly; the fetcher may download it (raw copies stay in
#                            knowledge/raw/, git-ignored, never redistributed; only cited facts are committed)
#           user-supplied  - paid, login-only, or not reachable by an automated client: the user provides a copy
#                            (`spongepark knowledge add --source <id> --file <path>`)
#           metadata-only  - registered for reference; nothing is downloaded
# status:   what the check of 2026-10-20 found (landing pages, terms pages, robots.txt and HEAD requests only;
#           nothing was downloaded). "blocked" = the owner's site refuses automated clients (403, bot check):
#           never worked around; a person checks it in a browser or supplies the copy.
# climate:  Koppen class(es) of the source's home region (rules record it; sizing always uses the project's storms)
# elements: rain_garden, bioswale, vegetated_swale, filter_strip, tree_trench, infiltration_trench, recharge_well,
#           permeable_pavement, green_roof, rainwater_harvesting, detention_basin, retention_pond,
#           constructed_wetland, check_dam, depave
# priority: 1 = needed for K2 (the five core elements), 2 = K4, 3 = context / learning (Part B)

schema_version: "1.0"
checked: "2026-10-20"
user_agent: "spongepark-knowledge/0.1 (+https://github.com/joed3rek/FloodSimulation)"

